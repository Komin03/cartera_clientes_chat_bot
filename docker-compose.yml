services:
  app:
    build: .
    container_name: ecogarner-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      WEB_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: ecogarner-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-botcartera}
      MYSQL_USER: ${DB_USER:-botuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-botpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: